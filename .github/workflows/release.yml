name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          set -e
          SDK_ROOT="/usr/local/lib/android/sdk"
          if [ ! -d "$SDK_ROOT" ]; then
            SDK_ROOT="$RUNNER_TEMP/android-sdk"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -sSL -o "$RUNNER_TEMP/cmdline.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q "$RUNNER_TEMP/cmdline.zip" -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)"
          fi

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          curl -sSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle-dist"
          echo "$RUNNER_TEMP/gradle-dist/gradle-8.9/bin" >> "$GITHUB_PATH"

      # Signing material is never stored in the repository. When the four secrets
      # below are configured the release APK is signed with them; otherwise the
      # workflow also builds a debug-signed, installable APK for the release page.
      - name: Prepare optional signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "No signing secrets configured. A debug-signed APK will be published."
            exit 0
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ybow-release.jks"
          {
            echo "YBOW_KEYSTORE_FILE=$RUNNER_TEMP/ybow-release.jks"
            echo "YBOW_KEYSTORE_PASSWORD=$SIGNING_STORE_PASSWORD"
            echo "YBOW_KEY_ALIAS=$SIGNING_KEY_ALIAS"
            echo "YBOW_KEY_PASSWORD=$SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --console=plain

      - name: Build debug-signed APK for testing
        if: env.YBOW_KEYSTORE_FILE == ''
        run: gradle :app:assembleDebug --no-daemon --console=plain

      - name: Collect APK files
        run: |
          set -e
          mkdir -p dist
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/YBOW-Browser-${GITHUB_REF_NAME}-signed.apk"
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "dist/YBOW-Browser-${GITHUB_REF_NAME}-install.apk"
          fi
          ls -l dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ybow-browser-release-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: YBOW Browser ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.apk
          body: |
            ## YBOW Browser ${{ github.ref_name }}

            A modern, minimalist and Chromium-based Android web browser. Kotlin, Jetpack
            Compose and the Android WebView engine. No ads, no trackers, no analytics and
            no data leaving your device.

            ### Which file should I install?

            | File | Use it when |
            | --- | --- |
            | `YBOW-Browser-${{ github.ref_name }}-install.apk` | **Normal choice.** Signed with the standard Android debug key, installs on any device. |
            | `YBOW-Browser-${{ github.ref_name }}-signed.apk` | Only exists when the maintainer configured release signing secrets. |

            Supports Android 8.0 (API 26) and newer.

            ### Installing

            1. Download the APK from the **Assets** section below.
            2. Open it on your phone and confirm the install.
            3. Allow "install unknown apps" for your file manager or browser if Android asks.

            The debug key is regenerated on every build machine, so uninstall a previous
            version before installing a build signed with a different key.
